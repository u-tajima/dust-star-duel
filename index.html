<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d8c39e" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 23l4-14h16l4 14z' fill='%23f2be3d' stroke='%232b2016' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>GOLD RUSH DUEL</title>
  </head>
  <body>
    <div id="app">
      <main class="stage-frame">
        <canvas id="game-canvas"></canvas>

        <!-- Minimal Floating Top HUD -->
        <header class="hud-bar">
          <div class="hud-side hud-p1">
            <span class="hud-badge p1-badge" aria-label="Player"></span>
            <div class="gold-counter" id="p1-gold"></div>
            <div class="lives-counter" id="p1-lives"></div>
            <div class="gear-tag hidden" id="p1-gear"></div>
          </div>

          <div class="hud-center">
            <button class="icon-btn" id="btn-mute" aria-label="Sound">
              <svg viewBox="0 0 24 24" class="icon-svg" id="icon-sound-on">
                <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
                <path
                  d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              <svg viewBox="0 0 24 24" class="icon-svg hidden" id="icon-sound-off">
                <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
                <path
                  d="M16 9l5 6M21 9l-5 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <button class="icon-btn" id="btn-home" aria-label="Title">
              <svg viewBox="0 0 24 24" class="icon-svg">
                <path
                  d="M4 11l8-7 8 7v9h-5v-6H9v6H4v-9z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>

          <div class="hud-side hud-p2">
            <div class="gear-tag hidden" id="p2-gear"></div>
            <div class="lives-counter" id="p2-lives"></div>
            <div class="gold-counter" id="p2-gold"></div>
            <span class="hud-badge p2-badge" aria-label="Rival"></span>
          </div>
        </header>

        <!-- Landscape Overlay Touch Controls -->
        <section class="controller-deck" id="controller-deck" aria-label="Controls">
          <div class="pad-group pad-move">
            <button class="pad-btn pad-dir" id="ctrl-left" aria-label="Left">
              <svg viewBox="0 0 32 32" class="pad-icon">
                <path d="M21 6L9 16l12 10V6z" fill="currentColor" />
              </svg>
            </button>
            <button class="pad-btn pad-dir" id="ctrl-right" aria-label="Right">
              <svg viewBox="0 0 32 32" class="pad-icon">
                <path d="M11 6l12 10-12 10V6z" fill="currentColor" />
              </svg>
            </button>
          </div>

          <div class="pad-group pad-action">
            <button class="pad-btn pad-shoot" id="ctrl-shoot" aria-label="Shoot">
              <svg viewBox="0 0 32 32" class="pad-icon">
                <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2.5" />
                <circle cx="16" cy="16" r="3.5" fill="currentColor" />
                <path
                  d="M16 3v5M16 24v5M3 16h5M24 16h5"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <button class="pad-btn pad-jump" id="ctrl-jump" aria-label="Jump">
              <svg viewBox="0 0 32 32" class="pad-icon">
                <path d="M16 6l10 11h-6v9h-8v-9H6L16 6z" fill="currentColor" />
              </svg>
            </button>
          </div>
        </section>

        <!-- Title Overlay -->
        <section class="overlay" id="overlay-title">
          <div class="title-card">
            <div class="title-art-wrap">
              <img src="./assets/title-art.jpg" alt="" class="title-art" />
              <div class="title-logo">
                <h1>GOLD RUSH DUEL</h1>
              </div>
            </div>

            <div class="title-controls">
              <div class="rule-rows">
                <div class="stage-row">
                  <div class="cat-picker" id="cat-picker" role="radiogroup" aria-label="Stage Category">
                    <button class="mini-chip active" data-cat="normal">NORMAL</button>
                    <button class="mini-chip" data-cat="special">SPECIAL</button>
                  </div>
                  <div class="stage-picker" id="stage-picker" role="radiogroup" aria-label="Stage">
                    <button class="stage-chip active" data-stage="0" data-cat="normal">WASTELAND</button>
                    <button class="stage-chip" data-stage="1" data-cat="normal">SALOON</button>
                    <button class="stage-chip" data-stage="2" data-cat="normal">TOWN</button>
                    <button class="stage-chip hidden" data-stage="3" data-cat="special">TRAIN</button>
                    <button class="stage-chip hidden" data-stage="4" data-cat="special">MINE</button>
                    <button class="stage-chip hidden" data-stage="5" data-cat="special">STORM</button>
                  </div>
                </div>

                <div class="rule-subrow">
                  <div class="mini-picker" id="gold-picker" role="radiogroup" aria-label="Target Gold">
                    <span class="mini-label">GOLD</span>
                    <button class="mini-chip active" data-gold="5">5</button>
                    <button class="mini-chip" data-gold="8">8</button>
                    <button class="mini-chip" data-gold="10">10</button>
                  </div>

                  <div class="mini-picker" id="lives-picker" role="radiogroup" aria-label="Lives">
                    <span class="mini-label">LIVES</span>
                    <button class="mini-chip active" data-lives="3">3</button>
                    <button class="mini-chip" data-lives="5">5</button>
                    <button class="mini-chip" data-lives="0">∞</button>
                  </div>
                </div>
              </div>

              <div class="title-cta">
                <button class="primary-btn" id="btn-start">SOLO</button>
                <button class="secondary-btn" id="btn-open-lobby">ONLINE</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Dedicated Online Matchmaking Screen -->
        <section class="overlay hidden" id="overlay-lobby">
          <div class="lobby-card">
            <div class="lobby-header">
              <button class="lobby-back-btn" id="btn-lobby-back" aria-label="Back">
                <svg viewBox="0 0 24 24" width="18" height="18">
                  <path
                    d="M15 5l-7 7 7 7"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span>BACK</span>
              </button>
              <h2 class="lobby-title">ONLINE MATCH</h2>
              <span class="lobby-status-pill hidden" id="room-status"></span>
            </div>

            <div class="lobby-body">
              <!-- Host Panel -->
              <div class="lobby-panel" id="lobby-host-panel">
                <div class="panel-heading">HOST</div>
                <button class="secondary-btn lobby-create-btn" id="btn-create-room">CREATE ROOM</button>

                <div class="host-invite hidden" id="host-invite">
                  <div class="qr-wrap">
                    <canvas id="lobby-qr" width="128" height="128"></canvas>
                  </div>
                  <div class="invite-meta">
                    <div class="invite-code" id="invite-code">----</div>
                    <div class="invite-actions">
                      <button class="mini-chip" id="btn-copy-link">COPY LINK</button>
                      <button class="mini-chip hidden" id="btn-share-link">SHARE</button>
                    </div>
                    <button class="primary-btn lobby-start-btn" id="btn-online-start" disabled>WAIT</button>
                  </div>
                </div>
              </div>

              <!-- Guest Panel -->
              <div class="lobby-panel" id="lobby-join-panel">
                <div class="panel-heading">JOIN</div>
                <div class="join-row">
                  <input
                    type="text"
                    id="input-room-code"
                    class="code-input lobby-code-input"
                    maxlength="4"
                    placeholder="CODE"
                    autocomplete="off"
                    spellcheck="false"
                  />
                  <button class="primary-btn lobby-join-btn" id="btn-join-room">JOIN</button>
                </div>
                <div class="join-hint" id="join-hint"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- Result Overlay -->
        <section class="overlay hidden" id="overlay-result">
          <div class="result-card">
            <div class="result-emblem" id="result-emblem"></div>
            <h2 class="result-title" id="result-title">VICTORY</h2>
            <div class="result-score" id="result-score">5 - 2</div>
            <div class="result-actions">
              <button class="primary-btn" id="btn-rematch">REMATCH</button>
              <button class="secondary-btn" id="btn-to-title">STAGE</button>
            </div>
          </div>
        </section>

        <!-- Landscape-Only Rotate Guide -->
        <section class="rotate-overlay" id="overlay-rotate" aria-live="polite">
          <div class="rotate-card">
            <svg viewBox="0 0 64 64" class="rotate-icon" aria-hidden="true">
              <rect x="20" y="10" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3" />
              <circle cx="32" cy="48" r="2" fill="currentColor" />
              <path
                d="M50 24a18 18 0 0 1-4 18M46 42l6-1-3-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <div class="rotate-title">LANDSCAPE ONLY</div>
            <div class="rotate-sub">端末を横向きにしてプレイしてください</div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
